# vscode — the VS Code extension CI: the editor extension's test suite, run
# through pnpm + Node.
#
# It mirrors go.yml's shape: the workflow always triggers, the `editor` job is
# conditional on an extension-relevant change, and the single required check is
# the `vscode` gate, which passes when the job succeeded or was skipped. A path
# filter on the trigger would leave the required check pending on a PR that does
# not touch the extension; gating per job keeps it safe for branch protection.
name: vscode

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: vscode-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # paths-filter reads the PR's changed files

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      editor: ${{ steps.filter.outputs.editor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            editor:
              - 'toolchain/editors/vscode/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.tool-versions'
              - '.github/workflows/vscode.yml'

  editor:
    name: editor extension
    needs: changes
    if: needs.changes.outputs.editor == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm must be set up before setup-node so its cache: 'pnpm' can find the
      # store; the pnpm version comes from the root package.json packageManager
      # field.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Track the project's Node version (.tool-versions), the single source
          # of truth dev and CI share — as the Go jobs track go.mod.
          node-version-file: .tool-versions
          cache: 'pnpm'
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Editor extension tests
        run: cd toolchain/editors/vscode && node --test

  # The single required check — passes when the editor job succeeded or was
  # skipped, so a PR that does not touch the extension is never left pending.
  vscode:
    name: vscode
    needs: [changes, editor]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the editor check to have passed or been skipped
        env:
          RESULTS: >-
            ${{ needs.changes.result }}
            ${{ needs.editor.result }}
        run: |
          ok=1
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::an editor check ended in '$r'"; ok=0 ;;
            esac
          done
          [ "$ok" = 1 ]
