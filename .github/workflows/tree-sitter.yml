# tree-sitter — the tree-sitter grammar's CI gate (C-3).
#
# It mirrors vscode.yml: it always triggers, the `grammar` job is conditional on
# a grammar-relevant change, and the single required check is the `tree-sitter`
# gate, which passes when the job succeeded or was skipped. The grammar job runs
# the node test suites the Go gate cannot reach — the CST-pin (the tree-sitter
# skeleton vs the real parser's CST) and the highlight golden. (Grammar
# *consistency* — the committed parser matching grammar.js — is already guarded
# by go.yml's generate job via `make verify-generated`.)
#
# The publish to the dedicated mirror repo rides the nightly (nightly.yml's
# tree-sitter job), as the vsix does — it is a distribution step, not this gate.
name: tree-sitter

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tree-sitter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # paths-filter reads the PR's changed files

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      grammar: ${{ steps.filter.outputs.grammar }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            grammar:
              - 'toolchain/grammars/tree-sitter-masterbelt/**'
              # The CST-pin reads the example corpus and the real parser's CST
              # snapshots, so a change to either must re-run it.
              - 'pkg/belt/testdata/examples/**'
              - 'pkg/belt/parser/concrete/testdata/examples/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.tool-versions'
              - '.github/workflows/tree-sitter.yml'

  grammar:
    name: grammar tests
    needs: changes
    if: needs.changes.outputs.grammar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # pnpm before setup-node so cache: 'pnpm' finds the store.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .tool-versions
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The CST-pin and the highlight golden compile the committed parser.c
      # (tree-sitter parse/query), so a C compiler is needed — present on the
      # runner by default.
      - name: Grammar tests (CST-pin + highlight golden)
        run: cd toolchain/grammars/tree-sitter-masterbelt && node --test

  # The single required check — passes when the grammar job succeeded or was
  # skipped, so a PR that does not touch the grammar is never left pending.
  tree-sitter:
    name: tree-sitter
    needs: [changes, grammar]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the grammar check to have passed or been skipped
        env:
          RESULTS: >-
            ${{ needs.changes.result }}
            ${{ needs.grammar.result }}
        run: |
          ok=1
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a grammar check ended in '$r'"; ok=0 ;;
            esac
          done
          [ "$ok" = 1 ]
