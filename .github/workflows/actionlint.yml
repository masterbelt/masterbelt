# actionlint — lint the workflows themselves (actionlint, pinned as a go.mod
# tool) so a broken or unsafe workflow change is caught in CI.
#
# Unlike go.yml and vscode.yml this is NOT path-filtered: it always runs and is
# cheap, so it can be a required check without the per-job skip dance those
# workflows need — and it validates every workflow on every change, which is the
# point of a workflow linter.
name: actionlint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go tool actionlint -color
