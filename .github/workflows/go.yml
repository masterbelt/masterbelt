# go — the Go toolchain CI: gofmt, vet, golangci-lint, generated-file check,
# the test suite, and the deterministic performance gates (the reuse snapshot
# and the allocation ceilings). Each concern is its own job so a failure points
# at exactly one thing and the checks run in parallel.
#
# Every job is conditional on a Go-relevant change (the `changes` filter): a PR
# that touches only the editor extension, docs, or another workflow skips them
# all. To keep that safe for branch protection, the workflow ALWAYS triggers and
# the skipping happens per job — a path filter on the trigger would leave a
# required check pending forever on a non-matching PR. The single required check
# is the `go` gate, which passes when every Go job succeeded or was skipped.
#
# Wall-clock benchmarks are a trend, not a pass/fail condition, so they live in
# the separate perf-trend workflow; this workflow gates only on deterministic
# results to stay non-flaky.
name: go

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on a branch so a fast push does not queue stale work.
concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # paths-filter reads the PR's changed files

jobs:
  # Detect whether anything that can move a Go result changed. Every job below
  # gates on `go`; the gate job treats a skip as a pass.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - '**.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.golangci.yml'
              - '**/testdata/**'
              # The tree-sitter grammar is a generate target too: a grammar.js or
              # query edit must regenerate (verify-generated guards it), so the
              # generate gate has to see it. The pnpm files gate the toolchain
              # `make verify-generated` now runs (tree-sitter generate).
              - 'toolchain/grammars/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.tool-versions'
              - '.github/workflows/go.yml'
              - '.github/workflows/test.yml'

  format:
    name: gofmt
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          unformatted="$(gofmt -l pkg cmd internal toolchain)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

  belt-format:
    name: belt fmt
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make check-fmt

  vet:
    name: go vet
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...

  lint:
    name: golangci-lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  generate:
    name: generated files
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # verify-generated regenerates the tree-sitter grammar too (tree-sitter
      # generate), so the node toolchain and the pinned CLI must be present.
      # pnpm before setup-node so cache: 'pnpm' finds the store.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: make verify-generated

  # The test suite is the one check shared with the nightly gate, so it lives in
  # a reusable workflow both call.
  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    uses: ./.github/workflows/test.yml

  perf:
    name: performance gates
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make perf

  # Code coverage for GitHub Code Quality — advisory, never a gate (it is not in
  # the `go` job's needs, so it cannot block a merge). It runs apart from the
  # test gate so the gate stays fast on a plain `go test` while coverage pays for
  # cross-package instrumentation; the cost is one extra test run, which the
  # suite can spare. The PR's head commit is checked out so Code Quality maps the
  # coverage to it and diffs it against the default branch's baseline (the main
  # push builds that baseline). Coverage is read as a trend — "does this change
  # leave something untested" — never a percentage target.
  coverage:
    name: code coverage
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write # GitHub Code Quality upload (2026-05 preview)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # -coverpkg=./... counts cross-package exercise: a layer (ir, types) is
      # driven mostly by another's tests (semantic), so per-package counts would
      # understate it. atomic mode keeps the count exact.
      - name: Test with coverage
        run: go test -covermode=atomic -coverpkg=./... -coverprofile=cover.out ./...
      - name: Convert to Cobertura
        run: go run github.com/boumenot/gocover-cobertura@v1.5.0 -ignore-gen-files <cover.out >coverage.xml
      # The upload needs code-quality:write, which a forked PR's token lacks, so
      # it is skipped there — the coverage still ran, only the comment is forgone.
      - name: Upload to Code Quality
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1.4.2
        with:
          file: coverage.xml
          language: go
          label: go

  # The single required check. It always runs and passes when every Go job
  # either succeeded or was skipped (the change did not touch Go), so a
  # non-matching PR is never left pending — and a real failure still reds it.
  # coverage is intentionally absent: it is advisory and must never block.
  go:
    name: go
    needs: [changes, format, belt-format, vet, lint, generate, test, perf]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Go check to have passed or been skipped
        env:
          RESULTS: >-
            ${{ needs.changes.result }}
            ${{ needs.format.result }}
            ${{ needs.belt-format.result }}
            ${{ needs.vet.result }}
            ${{ needs.lint.result }}
            ${{ needs.generate.result }}
            ${{ needs.test.result }}
            ${{ needs.perf.result }}
        run: |
          ok=1
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a Go check ended in '$r'"; ok=0 ;;
            esac
          done
          [ "$ok" = 1 ]
