# test runs the Go test suite. It is a reusable workflow (workflow_call) so the
# CI checks and the nightly gate run the exact same tests from one definition —
# tests are the gate that says the build works; the other checks (gofmt, vet,
# lint, …) are quality signals, not ship blockers.
name: test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
