# test runs the Go test suite. It is a reusable workflow (workflow_call) so the
# CI checks and the nightly gate run the exact same tests from one definition —
# tests are the gate that says the build works; the other checks (gofmt, vet,
# lint, …) are quality signals, not ship blockers.
name: test

on:
  workflow_call:
    inputs:
      ref:
        description: The ref to test; defaults to the commit that triggered the run.
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
