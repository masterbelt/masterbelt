# test runs the Go test suite. It is a reusable workflow (workflow_call) so the
# CI checks and the nightly gate run the exact same tests from one definition —
# tests are the gate that says the build works; the other checks (gofmt, vet,
# lint, …) are quality signals, not ship blockers.
name: test

on:
  workflow_call:
    inputs:
      ref:
        description: The ref to test; defaults to the commit that triggered the run.
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
