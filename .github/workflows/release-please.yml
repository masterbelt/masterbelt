# release-please keeps the stable-release bookkeeping reviewable. Commits on a
# release branch update a single Release PR with the next version and CHANGELOG;
# merging that PR makes release-please create the vX.Y.Z tag and GitHub Release.
# Publishing that release fires release-stable's `release: published` trigger,
# which builds and attaches the artifacts.
#
# release-please acts through a GitHub App token, not the default GITHUB_TOKEN,
# for two reasons: the default token is not permitted to create pull requests in
# this org, and a release the App token publishes DOES start release-stable (a
# GITHUB_TOKEN-published release cannot start another workflow). The App
# (RELEASE_PLEASE_APP_*) must be installed on this repository with these
# repository permissions: Contents: write (branches, tags, the release),
# Pull requests: write (the Release PR), and Issues: write (its autorelease:*
# labels). Without the secrets configured this workflow fails at the token step.
name: release-please

on:
  push:
    branches:
      - main
      - 'release/v*'
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

# Only the App token acts on the repo; the workflow's own GITHUB_TOKEN needs
# nothing beyond the default read.
permissions:
  contents: read

jobs:
  release-please:
    name: prepare or create release
    runs-on: ubuntu-latest
    steps:
      # Mint a short-lived token from the App, scoped to this repository. It
      # carries the App's Contents/Pull requests/Issues permissions, which is what
      # lets release-please open the Release PR the default token cannot.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Prepare the Release PR against the branch the commit landed on, so a
          # release/v* maintenance branch updates its own PR rather than main's.
          target-branch: ${{ github.ref_name }}
