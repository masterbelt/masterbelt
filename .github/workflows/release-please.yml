# release-please keeps the stable-release bookkeeping reviewable. Commits on a
# release branch update a single Release PR with the next VERSION and CHANGELOG;
# merging that PR makes release-please create the vX.Y.Z tag and GitHub Release.
name: release-please

on:
  push:
    branches:
      - main
      - 'release/v*'
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: prepare or create release
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
