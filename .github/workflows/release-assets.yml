# release-assets attaches the binaries to a stable GitHub Release. The release
# tag is the source of truth: the job checks out that exact ref, verifies it
# matches the recorded release version, then builds the same reproducible
# archives the nightly workflow exercises — stamped to report the release
# version on the stable channel.
name: release assets

on:
  # The primary path: release-please dispatches this with the tag it created,
  # because its GITHUB_TOKEN-published release cannot raise a `release` event
  # that starts a workflow. `release: published` stays as a fallback for a
  # release published by hand (a human token does raise the event).
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build, for example v0.1.1
        required: true
        type: string

concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: build stable artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      # Only build and attest code that reached a protected branch. A release tag
      # legitimately points at the commit release-please merged to main (or a
      # release/v* maintenance branch); a tag cut from an unreviewed commit must
      # not run its build scripts here with this job's contents:write and OIDC
      # permissions. This runs before any step that executes the checkout's code.
      - name: Verify the tag is on a protected branch
        run: |
          git fetch --quiet --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/release/v*:refs/remotes/origin/release/v*' || true
          sha="$(git rev-parse HEAD)"
          for ref in $(git for-each-ref --format='%(refname)' \
              refs/remotes/origin/main refs/remotes/origin/release/v*); do
            if git merge-base --is-ancestor "$sha" "$ref"; then
              echo "tag commit $sha is on ${ref#refs/remotes/}"
              exit 0
            fi
          done
          echo "::error::tag commit $sha is not on main or a release/v* branch"
          exit 1

      - name: Verify the tag matches the recorded release version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version="$(jq -r '."."' .release-please-manifest.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match the release-please version $version"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Reproducibility check
        run: make repro-check

      - name: Cross-build and archive
        # Stamp the binaries with the release version (the tag, minus its v) so
        # they report it on the stable channel rather than the rolling line.
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: STABLE_VERSION="${TAG#v}" make dist

      - name: Verify the built binaries report the release version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          built="$(cat dist/VERSION)"
          if [ "$built" != "${TAG#v}" ]; then
            echo "::error::built version $built does not match release tag $TAG"
            exit 1
          fi

      - name: Smoke test
        run: |
          tmp="$(mktemp -d)"
          tar -xzf dist/masterbelt-linux-amd64.tar.gz -C "$tmp"
          "$tmp/masterbelt" version
          "$tmp/masterbelt" check pkg/belt/testdata/examples/0009-project

      # Build provenance attestation needs a public repo or an org plan that
      # includes artifact attestations; on a private repo without it the attest
      # API returns "Feature not available" and reds the build. Probe visibility
      # so the build skips the attest step instead of failing, and picks it back
      # up automatically once the repo is public — the same guard nightly uses.
      - name: Decide whether provenance attestation is available
        id: attest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh repo view --json visibility -q .visibility 2>/dev/null || echo private)" = public ]; then
            echo "attest=true" >>"$GITHUB_OUTPUT"
          else
            echo "provenance attestation unavailable for a private repo on this plan — skipping it"
            echo "attest=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Attest build provenance
        if: steps.attest.outputs.attest == 'true'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/masterbelt-*.tar.gz
            dist/masterbelt-*.zip
            dist/SHA256SUMS

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$TAG" \
            dist/masterbelt-*.tar.gz \
            dist/masterbelt-*.zip \
            dist/SHA256SUMS \
            dist/VERSION \
            --clobber
