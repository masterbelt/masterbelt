# release-stable — publish a stable release. It builds and publishes the SAME
# four artifacts the nightly does, from the SAME composite actions in
# .github/actions, so a stable release can never silently ship less than a
# nightly:
#
#   - the cross-platform CLI archives, attached to the GitHub Release;
#   - the multi-arch container image (ghcr :X.Y.Z, :X.Y, :X, :latest);
#   - the VS Code extension .vsix (Marketplace stable channel);
#   - the tree-sitter grammar, tagged v<semver> — the tag that unlocks the
#     mirror's public npm + crates.io + PyPI publish (nightly tags do not).
#
# release-please.yml dispatches this with the tag it created, because its
# GITHUB_TOKEN-published release cannot raise a `release` event that starts a
# workflow. `release: published` stays as a fallback for a release published by
# hand. The version stamped into every artifact is the tag, verified against the
# release-please manifest, and the tag is refused unless its commit reached a
# protected branch.
name: release stable

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build, for example v0.1.1
        required: true
        type: string

concurrency:
  group: release-stable-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Resolve and vet the tag once; every build job keys off this job's outputs and
  # depends on it, so nothing builds or attests until the tag is trusted.
  verify:
    name: verify the release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - name: Resolve the tag
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          # Pin the exact commit the checks below vet, so every downstream job
          # builds that immutable SHA even if the tag is later moved.
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "sha=$(git rev-parse HEAD)"
          } >>"$GITHUB_OUTPUT"

      # Only build and attest code that reached a protected branch. A release tag
      # legitimately points at the commit release-please merged to main (or a
      # release/v* maintenance branch); a tag cut from an unreviewed commit must
      # not run its build scripts with this workflow's write/OIDC permissions.
      - name: Verify the tag is on a protected branch
        run: |
          git fetch --quiet --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/release/v*:refs/remotes/origin/release/v*' || true
          sha="$(git rev-parse HEAD)"
          for ref in $(git for-each-ref --format='%(refname)' \
              refs/remotes/origin/main refs/remotes/origin/release/v*); do
            if git merge-base --is-ancestor "$sha" "$ref"; then
              echo "tag commit $sha is on ${ref#refs/remotes/}"
              exit 0
            fi
          done
          echo "::error::tag commit $sha is not on main or a release/v* branch"
          exit 1

      - name: Verify the tag matches the recorded release version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version="$(jq -r '."."' .release-please-manifest.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match the release-please version $version"
            exit 1
          fi

  # The same test gate CI and the nightly run — pinned to the tag's code.
  gate:
    needs: verify
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.verify.outputs.sha }}

  build:
    name: cross-build
    needs: [verify, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write     # mint the OIDC token the attestation is signed with
      attestations: write # write the SLSA provenance attestation
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: ./.github/actions/build-cli
        id: cli
        with:
          stable-version: ${{ needs.verify.outputs.version }}
      - name: Verify the built binaries report the release version
        env:
          BUILT: ${{ steps.cli.outputs.version }}
          WANT: ${{ needs.verify.outputs.version }}
        run: |
          if [ "$BUILT" != "$WANT" ]; then
            echo "::error::built version $BUILT does not match release version $WANT"
            exit 1
          fi
      - uses: ./.github/actions/attest
        with:
          subject-path: |
            dist/masterbelt-*.tar.gz
            dist/masterbelt-*.zip
            dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: masterbelt-stable
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/VERSION
          if-no-files-found: error

  image:
    name: container image
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: masterbelt-stable
          path: dist
      - name: Stable image tags
        id: tags
        env:
          V: ${{ needs.verify.outputs.version }}
        run: |
          repo="ghcr.io/${{ github.repository }}"
          major="${V%%.*}"   # X
          minor="${V%.*}"    # X.Y
          {
            echo 'tags<<EOF'
            echo "$repo:$V"
            echo "$repo:$minor"
            echo "$repo:$major"
            echo "$repo:latest"
            echo 'EOF'
          } >>"$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-image
        id: image
        with:
          tags: ${{ steps.tags.outputs.tags }}
      - uses: ./.github/actions/attest
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: 'true'

  vsix:
    name: editor extension package
    # Wait for the CLI build: a stable Marketplace publish is irreversible, so it
    # must not happen for a release whose binaries failed to build.
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .tool-versions
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/package-vsix
        with:
          version: ${{ needs.verify.outputs.version }}
          pre-release: 'false'
          vsce-pat: ${{ secrets.VSCE_PAT }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: masterbelt-vsix
          path: toolchain/editors/vscode/masterbelt.vsix
          if-no-files-found: error

  tree-sitter:
    name: tree-sitter grammar
    # Wait for the CLI build: tagging the grammar mirror triggers an irreversible
    # public-registry publish, so it must not run for a release that failed to build.
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .tool-versions
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/publish-grammar
        with:
          ts-version: ${{ needs.verify.outputs.version }}
          app-client-id: ${{ secrets.TREE_SITTER_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.TREE_SITTER_APP_PRIVATE_KEY }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tree-sitter-masterbelt
          path: dist/tree-sitter-masterbelt
          if-no-files-found: error

  # Attach the CLI archives and the .vsix to the Release release-please created.
  # The image and the grammar publish to their own registries above.
  publish:
    name: attach assets to the release
    needs: [verify, build, vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: masterbelt-stable
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: masterbelt-vsix
          path: dist
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}   # no checkout in this job; tell gh the repo
          TAG: ${{ needs.verify.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber
