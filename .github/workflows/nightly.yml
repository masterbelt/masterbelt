# nightly — the rolling pre-release. It runs the test gate, then builds and
# publishes the same four artifacts a stable release does, from the shared
# composite actions in .github/actions (build-cli, attest, build-image,
# package-vsix, publish-grammar) so the two channels can never drift:
#
#   - the cross-platform CLI archives, attached to the rolling `nightly` release;
#   - the multi-arch container image (ghcr :nightly and a pinned :nightly-<date>-<sha>);
#   - the VS Code extension .vsix (attached to the release; Marketplace is stable-only);
#   - the tree-sitter grammar, synced and tagged to its mirror.
#
# The stable counterpart (release-stable.yml) calls the same actions with the
# release version and the stable tags. This workflow adds only what is
# nightly-specific: the skip-if-unchanged guard and the rolling release publish.
name: nightly

on:
  schedule:
    # 04:17 UTC daily — off-peak, a non-round minute to dodge the cron rush, and
    # distinct from perf-nightly's 03:17.
    - cron: '17 4 * * *'
  # Manual re-runs, and the initial bring-up.
  workflow_dispatch:

# Serialize nightly runs without aborting one in flight (a build is not a gate).
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Skip a nightly that would rebuild the exact commit already released — but
  # never skip a manual dispatch, and never skip when the last release can't be
  # read (better to rebuild than to miss a build).
  guard:
    name: skip if unchanged
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(git rev-parse HEAD)"
          last="$(gh release view nightly --json targetCommitish -q .targetCommitish 2>/dev/null || true)"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "manual dispatch — building"
            echo "build=true" >>"$GITHUB_OUTPUT"
          elif [ -n "$last" ] && [ "$last" = "$head" ]; then
            echo "HEAD ($head) is already the nightly — skipping"
            echo "build=false" >>"$GITHUB_OUTPUT"
          else
            echo "building (previous nightly: ${last:-none})"
            echo "build=true" >>"$GITHUB_OUTPUT"
          fi

  # Don't ship red: the same tests CI runs must pass before anything is built.
  gate:
    needs: guard
    if: needs.guard.outputs.build == 'true'
    uses: ./.github/workflows/test.yml

  build:
    name: cross-build
    needs: [guard, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write     # mint the OIDC token the attestation is signed with
      attestations: write # write the SLSA provenance attestation
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/build-cli
      - uses: ./.github/actions/attest
        with:
          subject-path: |
            dist/masterbelt-*.tar.gz
            dist/masterbelt-*.zip
            dist/SHA256SUMS
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: masterbelt-nightly
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/VERSION
          retention-days: 14
          if-no-files-found: error

  # Push the multi-arch container image to ghcr: the same static binaries the
  # release ships, copied onto distroless. The :nightly tag rolls; the
  # :nightly-<date>-<sha> tag is immutable for pinning.
  image:
    name: container image
    needs: [guard, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write     # mint the OIDC token the attestation is signed with
      attestations: write # write the SLSA provenance attestation
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: masterbelt-nightly
          path: dist
      - name: Nightly image tags
        id: tags
        run: |
          version="$(cat dist/VERSION)"
          patch="${version%+*}"; patch="${patch##*.}"   # the commit date
          sha="${version#*+}"                            # the short SHA
          {
            echo 'tags<<EOF'
            echo "ghcr.io/${{ github.repository }}:nightly"
            echo "ghcr.io/${{ github.repository }}:nightly-${patch}-${sha}"
            echo 'EOF'
          } >>"$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-image
        id: image
        with:
          tags: ${{ steps.tags.outputs.tags }}
      - uses: ./.github/actions/attest
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: 'true'

  # Build the VS Code extension .vsix and attach it to the nightly release (it is
  # uploaded as an artifact here and picked up by the publish job). The nightly is
  # NOT published to the Marketplace — only stable releases go there, so the
  # Marketplace keeps a single, clean version lane and a stable version is never
  # shadowed by a higher-numbered nightly pre-release.
  vsix:
    name: editor extension package
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .tool-versions
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Nightly extension version
        id: ver
        run: |
          # The CLI version without build metadata — 0.1.<UTC commit date>,
          # monotonic for the rolling pre-release.
          echo "version=0.1.$(TZ=UTC0 git show -s --date=format-local:%Y%m%d --format=%cd HEAD)" >>"$GITHUB_OUTPUT"
      # No vsce-pat: the nightly builds the .vsix but does not publish it to the
      # Marketplace (stable-only lane).
      - uses: ./.github/actions/package-vsix
        with:
          version: ${{ steps.ver.outputs.version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: masterbelt-vsix
          path: toolchain/editors/vscode/masterbelt.vsix
          if-no-files-found: error

  # Publish the tree-sitter grammar by syncing it to the dedicated mirror repo and
  # tagging it; the mirror's own workflows publish to the registries. The nightly
  # carries a -nightly.<sha> prerelease version, so its tag publishes to GitHub
  # Packages only (a nightly on public npm would bloat the packument); the stable
  # release's clean v<semver> tag is what reaches public npm + crates.io + PyPI.
  tree-sitter:
    name: tree-sitter grammar
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .tool-versions
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/publish-grammar
        with:
          app-client-id: ${{ secrets.TREE_SITTER_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.TREE_SITTER_APP_PRIVATE_KEY }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tree-sitter-masterbelt
          path: dist/tree-sitter-masterbelt
          if-no-files-found: error

  # Overwrite the single rolling `nightly` pre-release with this build's archives
  # and the .vsix, moving its tag to the built commit. Past builds live on as the
  # 14-day artifacts above; this release always points at the latest.
  publish:
    name: publish nightly release
    needs: [build, vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: masterbelt-nightly
          path: dist
      # The .vsix lands in dist/ too, so it is attached alongside the archives.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: masterbelt-vsix
          path: dist
      - name: Generate release notes
        run: sh build/release-notes.sh >notes.md
      - name: Publish the rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat dist/VERSION)"
          # Delete the old release and its tag, then recreate at this commit, so
          # the tag the guard reads back is this build's full SHA.
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly dist/* \
            --target "$(git rev-parse HEAD)" \
            --title "nightly $version" \
            --notes-file notes.md \
            --prerelease
