# nightly — the cross-platform CLI build. It runs the test gate, cross-builds
# every release target with `make dist`, checks the build is reproducible,
# smoke-runs the native binary, and uploads the archives as workflow artifacts.
#
# It does NOT publish a release yet: the rolling nightly release (and the
# unchanged-since-last-nightly guard that needs a release to compare against)
# come later. Until then the artifacts are the distribution, kept for two weeks.
name: nightly

on:
  schedule:
    # 04:17 UTC daily — off-peak, a non-round minute to dodge the cron rush, and
    # distinct from perf-nightly's 03:17.
    - cron: '17 4 * * *'
  # Manual re-runs, and the initial bring-up.
  workflow_dispatch:

# Serialize nightly runs without aborting one in flight (a build is not a gate).
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Skip a nightly that would rebuild the exact commit already released — but
  # never skip a manual dispatch, and never skip when the last release can't be
  # read (better to rebuild than to miss a build).
  guard:
    name: skip if unchanged
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      attest: ${{ steps.decide.outputs.attest }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(git rev-parse HEAD)"
          last="$(gh release view nightly --json targetCommitish -q .targetCommitish 2>/dev/null || true)"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "manual dispatch — building"
            echo "build=true" >>"$GITHUB_OUTPUT"
          elif [ -n "$last" ] && [ "$last" = "$head" ]; then
            echo "HEAD ($head) is already the nightly — skipping"
            echo "build=false" >>"$GITHUB_OUTPUT"
          else
            echo "building (previous nightly: ${last:-none})"
            echo "build=true" >>"$GITHUB_OUTPUT"
          fi

          # Build provenance attestation needs a public repo or an org plan that
          # includes artifact attestations; on a private repo without it the
          # attest API returns "Feature not available" and reds the build. Probe
          # visibility so the build skips the attest steps instead of failing,
          # and picks them back up automatically once the repo is public. (If the
          # plan gains attestations while the repo stays private, widen this.)
          if [ "$(gh repo view --json visibility -q .visibility 2>/dev/null || echo private)" = public ]; then
            echo "attest=true" >>"$GITHUB_OUTPUT"
          else
            echo "provenance attestation unavailable for a private repo on this plan — skipping it"
            echo "attest=false" >>"$GITHUB_OUTPUT"
          fi

  # Don't ship red: the same tests CI runs must pass before anything is built.
  gate:
    needs: guard
    if: needs.guard.outputs.build == 'true'
    uses: ./.github/workflows/test.yml

  build:
    name: cross-build
    needs: [guard, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write     # mint the OIDC token the attestation is signed with
      attestations: write # write the SLSA provenance attestation
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      # Fail before the full cross-build if the build is not reproducible.
      - name: Reproducibility check
        run: make repro-check

      - name: Cross-build and archive
        run: make dist

      # The cross-built linux/amd64 binary runs on this runner: confirm it starts
      # and type-checks a real project before the artifacts are kept.
      - name: Smoke test
        run: |
          tmp="$(mktemp -d)"
          tar -xzf dist/masterbelt-linux-amd64.tar.gz -C "$tmp"
          "$tmp/masterbelt" version
          "$tmp/masterbelt" check pkg/belt/testdata/examples/0009-project

      # Attestation needs a public repo or a plan with artifact attestations;
      # guard probes for it so a private repo skips this rather than failing.
      - name: Attest build provenance
        if: needs.guard.outputs.attest == 'true'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/masterbelt-*.tar.gz
            dist/masterbelt-*.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: masterbelt-nightly
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/VERSION
          retention-days: 14
          if-no-files-found: error

  # Overwrite the single rolling `nightly` pre-release with this build's archives,
  # moving its tag to the built commit. Past builds live on as the 14-day
  # artifacts above; this release always points at the latest.
  publish:
    name: publish nightly release
    needs: [build, vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: masterbelt-nightly
          path: dist
      # The .vsix lands in dist/ too, so it is attached alongside the archives.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: masterbelt-vsix
          path: dist
      - name: Generate release notes
        run: sh build/release-notes.sh >notes.md
      - name: Publish the rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat dist/VERSION)"
          # Delete the old release and its tag, then recreate at this commit, so
          # the tag the guard reads back is this build's full SHA.
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly dist/* \
            --target "$(git rev-parse HEAD)" \
            --title "nightly $version" \
            --notes-file notes.md \
            --prerelease

  # Push the multi-arch container image to ghcr: the same static binaries the
  # release ships, copied onto distroless. The :nightly tag rolls; the
  # :nightly-<date>-<sha> tag is immutable for pinning.
  image:
    name: container image
    needs: [guard, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write     # mint the OIDC token the attestation is signed with
      attestations: write # write the SLSA provenance attestation
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: masterbelt-nightly
          path: dist
      - name: Stage the linux binaries into the build context
        run: |
          for arch in amd64 arm64; do
            mkdir -p build/ctx/linux/"$arch"
            tar -xzf dist/masterbelt-linux-"$arch".tar.gz -C build/ctx/linux/"$arch"
          done
      - name: Image metadata
        id: meta
        run: |
          version="$(cat dist/VERSION)"
          patch="${version%+*}"; patch="${patch##*.}"   # the commit date
          sha="${version#*+}"                            # the short SHA
          echo "datesha=$patch-$sha" >>"$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI HEAD)" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        id: build
        with:
          context: build
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:nightly
            ghcr.io/${{ github.repository }}:nightly-${{ steps.meta.outputs.datesha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
      - name: Attest image provenance
        if: needs.guard.outputs.attest == 'true'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Package the VS Code extension as a .vsix and, when a Marketplace token is
  # configured, publish it to the pre-release channel. Without the token the
  # .vsix is still built and attached to the release (publish degrades, never
  # fails) — so forks and token-less setups stay green.
  vsix:
    name: editor extension package
    needs: gate
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .tool-versions
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Package the extension
        working-directory: toolchain/editors/vscode
        run: |
          # vsce wants a LICENSE in the package; copy the repo's single MIT
          # license in rather than committing a second copy that could drift.
          cp "$GITHUB_WORKSPACE/LICENSE" LICENSE
          # The marketplace version is the CLI version without build metadata —
          # 0.1.<UTC commit date>, monotonic for the rolling pre-release.
          version="0.1.$(TZ=UTC0 git show -s --date=format-local:%Y%m%d --format=%cd HEAD)"
          npm pkg set version="$version"
          # Version-free filename for a deterministic download URL; vsce reads
          # the version from package.json (set above), not the file name.
          pnpm dlx @vscode/vsce package --pre-release --no-dependencies -o masterbelt.vsix
      - name: Publish to the Marketplace (when a PAT is configured)
        if: env.VSCE_PAT != ''
        working-directory: toolchain/editors/vscode
        run: pnpm dlx @vscode/vsce publish --pre-release --packagePath masterbelt.vsix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: masterbelt-vsix
          path: toolchain/editors/vscode/masterbelt.vsix
          if-no-files-found: error

  # Publish the tree-sitter grammar on the nightly, under the same
  # commit-derived version as the CLI, to two channels (the way the vsix
  # publishes to the Marketplace):
  #   - the dedicated git mirror (editors pin it) — when the masterbelt GitHub
  #     App is configured, pushing the rolling default branch and an immutable
  #     v<version> tag; absent, it only uploads the artifact.
  #   - GitHub Packages (web-tree-sitter consumers) — the npm package with the
  #     built WebAssembly module, via the built-in GITHUB_TOKEN.
  # The git mirror is synced before the wasm is built, so the editor channel
  # never depends on Docker/npm; a wasm or publish failure leaves it intact.
  tree-sitter:
    name: tree-sitter grammar
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publish the npm package to GitHub Packages
    env:
      # Routed through env so the token step can gate on it (secrets are not
      # usable in `if`). The App mints a short-lived token scoped to the mirror
      # repo and to Contents alone — no long-lived, account-wide credential, and
      # the org disallows deploy keys.
      TS_APP_CLIENT_ID: ${{ secrets.TREE_SITTER_APP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .tool-versions
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # Don't ship a stale or broken grammar: the committed parser must be fresh
      # and the CST-pin / highlight golden must pass before assembling.
      - name: Verify the generated grammar is fresh
        run: make verify-generated
      - name: Grammar tests (CST-pin + highlight golden)
        run: cd toolchain/grammars/tree-sitter-masterbelt && node --test

      # Assemble the standalone tree (stamps the masterbelt version into it).
      - name: Assemble the standalone package tree
        run: make publish-tree-sitter

      # Mint the short-lived, repo-scoped, contents-only token from the App.
      # Skips cleanly when the App is not configured (degrade to artifact).
      - name: Mint a scoped token from the masterbelt GitHub App
        id: app-token
        if: env.TS_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.TREE_SITTER_APP_CLIENT_ID }}
          private-key: ${{ secrets.TREE_SITTER_APP_PRIVATE_KEY }}
          owner: masterbelt
          repositories: tree-sitter-masterbelt
          permission-contents: write

      # Sync to the dedicated repo with the minted token. The source repo stays
      # the single truth; the mirror is overwritten with the assembled tree (so
      # a removed file propagates), pushed to its default branch (the rolling
      # preview) and tagged immutably as v<version> for editors to pin — the
      # version already carries the commit SHA, so the tag is unique and never
      # moves (C-3 §5).
      - name: Sync to masterbelt/tree-sitter-masterbelt
        if: steps.app-token.outputs.token != ''
        env:
          GH_PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -eu
          src="$PWD/dist/tree-sitter-masterbelt"
          version="$(node -p "require('$src/package.json').version")"
          sha="$(git rev-parse --short HEAD)"
          git config --global user.name 'masterbelt-bot'
          git config --global user.email 'noreply@masterbelt.dev'
          git clone --depth=1 \
            "https://x-access-token:${GH_PUSH_TOKEN}@github.com/masterbelt/tree-sitter-masterbelt.git" dest
          # Replace tracked content (keep .git) so deletions propagate.
          find dest -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$src"/. dest/
          cd dest
          git add -A
          if git diff --cached --quiet; then
            echo "dedicated repo already up to date — nothing to publish"
            exit 0
          fi
          git commit -m "sync grammar from masterbelt@${sha}"
          git push origin HEAD:main
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} already exists — leaving it immutable"
          else
            git tag "$tag"
            git push origin "$tag"
            echo "published ${tag}"
          fi

      # Build the WebAssembly module into the assembled tree (web-tree-sitter's
      # consumption path), then upload the complete package as an artifact. The
      # mirror was synced above without it, so this Docker step cannot affect the
      # editor channel.
      - name: Build the WebAssembly module
        run: make tree-sitter-wasm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tree-sitter-masterbelt
          path: dist/tree-sitter-masterbelt
          if-no-files-found: error

      # Publish the npm package (grammar + wasm) to GitHub Packages with the
      # built-in token — no extra secret, since the package scope matches the
      # org. Only from the canonical repo (a fork lacks the scope); a version
      # already published is skipped rather than failed (npm ignores build
      # metadata, so a same-day rebuild is the same version).
      - name: Publish to GitHub Packages
        if: github.repository == 'masterbelt/masterbelt'
        working-directory: dist/tree-sitter-masterbelt
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          {
            echo "@masterbelt:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          } > .npmrc
          if npm publish 2>publish.err; then
            echo "published $(node -p "require('./package.json').version")"
          elif grep -qiE "cannot publish over|previously published|already exists|409" publish.err; then
            echo "version already published — skipping"
          else
            cat publish.err >&2
            exit 1
          fi
          rm -f .npmrc publish.err
