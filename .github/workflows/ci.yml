# CI — the correctness checks plus the deterministic performance gates (the
# reuse snapshot and the allocation ceilings). Each concern is its own job so a
# failure points at exactly one thing and the checks run in parallel. Wall-clock
# benchmarks are a trend, not a pass/fail condition, so they live in the separate
# perf-trend workflow; this workflow gates only on deterministic results to stay
# non-flaky.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on a branch so a fast push does not queue stale work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          unformatted="$(gofmt -l pkg cmd internal toolchain)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2

  generate:
    name: generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make verify-generated

  # The test suite is the one check shared with the nightly gate, so it lives in
  # a reusable workflow both call.
  test:
    uses: ./.github/workflows/test.yml

  perf:
    name: performance gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make perf

  editor:
    name: editor extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # pnpm must be set up before setup-node so its cache: 'pnpm' can find the
      # store; the pnpm version comes from the root package.json packageManager
      # field.
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # Track the project's Node version (.tool-versions), the single source
          # of truth dev and CI share — as the Go jobs track go.mod.
          node-version-file: .tool-versions
          cache: 'pnpm'
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Editor extension tests
        run: cd toolchain/editors/vscode && node --test

  # Lint the workflows themselves (actionlint, pinned as a go.mod tool) so a
  # broken or unsafe workflow change is caught here.
  actionlint:
    name: workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go tool actionlint -color
