# build-cli — the one definition of "cross-build the CLI release archives". Both
# the nightly and the stable release flows use it, so the reproducibility check,
# the cross-build, and the smoke test never drift between channels. The caller
# checks out the ref to build; this stamps the version per channel and leaves
# dist/ populated (archives, SHA256SUMS, VERSION) for the caller to attest,
# upload, or attach.
name: build-cli
description: Cross-build the CLI archives, verify reproducibility, and smoke-test.

inputs:
  stable-version:
    description: >
      The release version to stamp into the binaries for a stable build (the tag
      minus its leading v). Empty for an ordinary build, which keeps the rolling
      commit-dated version on the nightly/dev channel.
    default: ''

outputs:
  version:
    description: The version string the built binaries report (dist/VERSION).
    value: ${{ steps.ver.outputs.version }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: go.mod
        cache: true

    # Fail before the full cross-build if the build is not reproducible.
    - name: Reproducibility check
      shell: bash
      run: make repro-check

    - name: Cross-build and archive
      shell: bash
      env:
        STABLE_VERSION: ${{ inputs.stable-version }}
      run: make dist

    # The cross-built linux/amd64 binary runs on this runner: confirm it starts
    # and type-checks a real project before the artifacts are kept.
    - name: Smoke test
      shell: bash
      run: |
        tmp="$(mktemp -d)"
        tar -xzf dist/masterbelt-linux-amd64.tar.gz -C "$tmp"
        "$tmp/masterbelt" version
        "$tmp/masterbelt" check pkg/belt/testdata/examples/0009-project

    - name: Read the built version
      id: ver
      shell: bash
      run: echo "version=$(cat dist/VERSION)" >>"$GITHUB_OUTPUT"
