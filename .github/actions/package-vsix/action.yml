# package-vsix — package the VS Code extension as a .vsix and, when a Marketplace
# token is given, publish it to the (stable) Marketplace channel. Only the stable
# release passes a token, so the Marketplace has a single, clean version lane; the
# nightly builds the .vsix the same way but publishes nowhere — it is attached to
# the nightly GitHub release for download instead. The caller checks out, sets up
# pnpm/node, and runs `pnpm install` first, then uploads masterbelt.vsix.
name: package-vsix
description: Package the VS Code extension and, with a token, publish it to the Marketplace.

inputs:
  version:
    description: The version to stamp into the package (no build metadata).
    required: true
  vsce-pat:
    description: >
      Marketplace PAT. When given, the .vsix is published to the Marketplace;
      when empty the publish step is skipped (the nightly, and any token-less
      setup, degrade to building the .vsix only).
    default: ''

runs:
  using: composite
  steps:
    - name: Package the extension
      shell: bash
      working-directory: toolchain/editors/vscode
      env:
        VERSION: ${{ inputs.version }}
      run: |
        # vsce wants a LICENSE in the package; copy the repo's single MIT license
        # in rather than committing a second copy that could drift.
        cp "$GITHUB_WORKSPACE/LICENSE" LICENSE
        npm pkg set version="$VERSION"
        # Version-free filename for a deterministic download URL; vsce reads the
        # version from package.json (set above), not the file name.
        pnpm dlx @vscode/vsce package --no-dependencies -o masterbelt.vsix

    - name: Publish to the Marketplace (when a PAT is configured)
      if: inputs.vsce-pat != ''
      shell: bash
      working-directory: toolchain/editors/vscode
      env:
        VSCE_PAT: ${{ inputs.vsce-pat }}
      run: pnpm dlx @vscode/vsce publish --packagePath masterbelt.vsix
