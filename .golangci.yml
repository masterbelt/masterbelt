version: "2"

# The complete state (tmp/plan/D-2-lint-ratchet.md §5): every adopted linter
# runs at its upstream-default thresholds — no commented-out backlog, no
# complexity settings, no TODOs. A linter absent from the enable list is a
# deliberate rejection recorded below, not a deferral. Exceptions live as
# `//nolint:<linter> // <reason>` at their sites; nolintlint enforces that
# every one names its linter and carries its reason.
#
# NOTE (resolved 2026-06-07): the old "findings drop between runs" mystery
# was issues.uniq-by-line (default true): every complexity linter reports on
# the function declaration's line, so enabling several together made them
# swallow each other's findings deterministically — not scheduling.
# uniq-by-line: false below keeps the numbers real.

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - copyloopvar
    - durationcheck
    - errorlint
    - exhaustive
    - funlen
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - intrange
    - maintidx
    - misspell
    - nestif
    - nilerr
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - revive
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  # Rejected (with reasons), not deferred:
  # - cyclop: the same metric as gocyclo, and its default 10 mostly punishes
  #   the compiler's dispatch switches; gocyclo carries the per-function
  #   ceiling instead.
  settings:
    exhaustive:
      # Writing a default arm declares the switch intentionally
      # non-exhaustive; an internal enum switch without one must list every
      # member.
      default-signifies-exhaustive: true
    goconst:
      # A test's repeated literals are its own readability business; the
      # production name literals get canonical constants (builtin.Name*).
      ignore-tests: true
    nolintlint:
      # Every exception names its linter and carries its reason — the
      # inventory that keeps the nolint set auditable.
      require-explanation: true
      require-specific: true
  exclusions:
    # Generated files are excluded from analysis, not just reporting:
    # goconst would otherwise count a generated file's literals toward a
    # hand-written file's occurrence threshold.
    generated: strict

issues:
  # The complexity linters (gocyclo, gocognit, funlen, maintidx, cyclop) all
  # report on the function declaration's line, so the default one-issue-per-
  # line dedupe makes them silently swallow each other's findings. Every
  # ratchet number is a lie without this.
  uniq-by-line: false

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/masterbelt/masterbelt
