version: "2"

# Linters that pass today are enabled; the rest are commented out with the
# issue counts measured on 2026-06-07 (post F-2/F-3/F-4, uniq-by-line: false)
# so enabling them is a sized, deliberate step rather than a surprise. Counts
# come from the probe protocol (tmp/plan/D-2-lint-ratchet.md §1):
#   golangci-lint run ./... --config /tmp/probe.yml \
#     --max-issues-per-linter 0 --max-same-issues 0
#
# NOTE (resolved 2026-06-07): the "findings drop between runs" mystery was
# issues.uniq-by-line (default true): every complexity linter reports on the
# function declaration's line, so enabling several together made them swallow
# each other's findings deterministically — not scheduling. uniq-by-line:
# false below makes the numbers real. The "staticcheck sometimes adds ~46
# SA5011 in tests" half of the old note did not reproduce across repeated
# runs and is considered stale.

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - copyloopvar
    - durationcheck
    - errorlint
    - gocritic
    - gocyclo # see settings: ceiling at 47, TODO ratchet down to 30
    - intrange
    - maintidx # at the upstream default floor (20)
    - misspell
    - nilerr
    - nolintlint
    - perfsprint
    - predeclared
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign

    - exhaustive
    - goconst
    - prealloc
    - revive # the full default rule set (exported docs included)


    - funlen # see settings: ceilings at today's worst, ratcheting to 60/40
    - gocognit # see settings: ceiling at today's worst, ratcheting to 30
    - nestif # see settings: ceiling at today's worst, ratcheting to 5
    # - cyclop # rejected: same metric as gocyclo, and the default 10 mostly
    #          # punishes the compiler's dispatch switches; gocyclo carries
    #          # the per-function ceiling instead.
  settings:
    exhaustive:
      # Writing a default arm declares the switch intentionally
      # non-exhaustive; an internal enum switch without one must list every
      # member.
      default-signifies-exhaustive: true
    goconst:
      # A test's repeated literals are its own readability business; the
      # production name literals get canonical constants (builtin.Name*).
      ignore-tests: true
    gocyclo:
      # Ceiling pinned to today's worst function. TODO: ratchet down to the
      # default 30 — 17 offenders at 30 as of 2026-06-07 (worst:
      # graphValueRaw=47, recordTypes=46, ConstantsEqual=42,
      # enforceEvalPublication=41); see tmp/plan/D-2-lint-ratchet.md §4.
      min-complexity: 47
    gocognit:
      # Ceiling pinned to today's worst (collectEffectUses). TODO: ratchet
      # to the default 30 — 54 offenders there as of 2026-06-07.
      min-complexity: 105
    funlen:
      # Ceilings pinned to today's worst (treegen emitDecoder 173 lines,
      # graphValueRaw 126 statements). TODO: ratchet to the default 60/40.
      lines: 173
      statements: 126
    nestif:
      # Ceiling pinned to today's worst (14; the linter reports at >= the
      # minimum). TODO: ratchet to the default 5.
      min-complexity: 15

  exclusions:
    # Generated files are excluded from analysis, not just reporting:
    # goconst would otherwise count a generated file's literals toward a
    # hand-written file's occurrence threshold.
    generated: strict

issues:
  # The complexity linters (gocyclo, gocognit, funlen, maintidx, cyclop) all
  # report on the function declaration's line, so the default one-issue-per-
  # line dedupe makes them silently swallow each other's findings. Every
  # ratchet number is a lie without this.
  uniq-by-line: false

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/masterbelt/masterbelt
